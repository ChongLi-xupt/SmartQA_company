services:
  smart-qa:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-qa:latest
    container_name: smart-qa
    # 应用对宿主机暴露 5000。不用 host 网络（Windows Docker Desktop 下
    # host 模式不生效，容器内 localhost≠宿主机，连不上 MySQL）。
    # 数据库改连下方同网络的 mysql 容器（服务名 mysql，容器内 3306）。
    ports:
      - "5000:5000"
    # 凭据从宿主机 .env 注入，不写进镜像
    env_file:
      - .env
    depends_on:
      - mysql
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mysql:
    image: mysql:5.7
    container_name: smart-qa-mysql
    # 宿主机 3307 映射到容器 3306，避免与宿主机原生 MySQL(3306) 冲突
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Root@Pv2026
    # MySQL 5.7 默认字符集 latin1，显式指定 utf8mb4 防中文 COMMENT 乱码
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建库建表 + 示例数据 + 只读账号（账号用 '%' 适配容器外部连接）
      - ./deploy/init_pv_database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

volumes:
  mysql_data: